name = "panda-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# No plaintext [vars] — all config is provided as secrets so a name is never
# both a var binding and a secret (that conflict is what caused the bulk upload
# to fail with "Binding name already in use").
#
#   Local dev   → worker/.dev.vars
#   Production  → wrangler secret bulk prod-secrets.json
#                 + wrangler secret put STRIPE_WEBHOOK_SECRET   (set after the
#                   prod webhook endpoint is registered)
